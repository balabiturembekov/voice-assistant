services:
  voice-assistant:
    build: .
    env_file:
      - .env
    environment:
      # База внутри смонтированного volume, чтобы переживала пересоздание контейнера
      - DATABASE_URL=sqlite:////app/instance/voice_assistant.db
      - FLASK_ENV=production
      - FLASK_DEBUG=False
    volumes:
      - ./instance:/app/instance
    # Доступ только с хоста: снаружи трафик идёт через системный nginx
    ports:
      - "127.0.0.1:8283:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
